name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  memory-limit:
    name: Sort and skewed aggregation exceed RAM (128 MiB executor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build static memory-test binary
        run: CGO_ENABLED=0 go test -c -o /tmp/gospark-memory.test .
      - name: Process 320 MiB under a hard 128 MiB memory limit
        run: |
          mkdir -p "$RUNNER_TEMP/gospark-scratch"
          docker run --name gospark-memory --memory=128m --memory-swap=128m \
            -e GOMEMLIMIT=64MiB -e GOSPARK_MEMORY_STRESS=1 \
            -v /tmp/gospark-memory.test:/bench:ro \
            -v "$RUNNER_TEMP/gospark-scratch:/tmp" \
            alpine:3.19 /bench -test.run '^TestBoundedLargeInput$' -test.v -test.timeout=15m
      - name: Memory container diagnostics and cleanup
        if: always()
        run: |
          docker inspect --format '{{json .State}}' gospark-memory || true
          docker rm -f gospark-memory || true
  build-test:
    name: Build and Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: |
          UNFMT=$(gofmt -l .)
          if [ -n "$UNFMT" ]; then
            echo "Files not gofmt-formatted:"
            echo "$UNFMT"
            exit 1
          fi

      - name: Go module check
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -timeout 300s ./...

      - name: Race test
        run: go test -race -count=1 -timeout 600s ./...

      - name: Coverage
        run: go test -count=1 -timeout 300s -coverprofile=coverage.out -covermode=atomic .

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error

  examples:
    name: Build examples and worker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build examples
        run: |
          go build ./examples/...
          go build -o bin/gospark-worker ./cmd/gospark-worker/

      - name: Run smoke test binary
        run: ./bin/gospark-worker smoke

      - name: Build container image
        run: docker build -t gospark/worker:ci .

      - name: Run wordcount in container
        run: docker run --rm gospark/worker:ci wordcount

  s3-commit:
    name: MinIO distributed output commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Start MinIO
        run: |
          docker build -f ci/Minio.Dockerfile -t gospark/minio:test .
          docker run -d --name gospark-minio -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=gosparktest -e MINIO_ROOT_PASSWORD=gosparktest-secret \
            gospark/minio:test server /data --address :9000
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs gospark-minio
          exit 1
      - name: Test real S3-compatible commits and retries
        env:
          GOSPARK_TEST_S3_ENDPOINT: http://127.0.0.1:19000
        run: go test -race -count=1 -timeout 180s -run '^TestMinIO' .
      - name: Stop MinIO
        if: always()
        run: docker rm -f gospark-minio || true
