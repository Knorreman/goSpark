name: K8s Distributed

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  two-pod:
    name: Two-pod shuffle on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOSPARK_NAMESPACE: gospark-two-pod
      GOSPARK_IMAGE: gospark/worker:latest
      GOSPARK_ENGINE: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Unit tests (incl. two-process HTTP shuffle)
        run: go test -count=1 -timeout 300s -run 'TestSchedule|TestK8s' .

      - name: Run two-pod distributed test
        run: ./k8s/two-pod.sh

      - name: Debug logs on failure
        if: failure()
        run: |
          kubectl get all -n "$GOSPARK_NAMESPACE" || true
          for pod in $(kubectl get pods -n "$GOSPARK_NAMESPACE" -o name 2>/dev/null); do
            echo "=== $pod ==="
            kubectl logs -n "$GOSPARK_NAMESPACE" "$pod" || true
          done

      - name: Cleanup
        if: always()
        run: kind delete cluster --name kind-cluster || true